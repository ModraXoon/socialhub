<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İstatistikler · SocialHub</title>
<style>
  :root { --bg:#0e1117; --card:#171b24; --line:#262c38; --text:#e8ebf1; --mute:#8b93a3; --acc:#22d3ee; --bad:#f87171; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; gap:12px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; } header a { color:var(--acc); text-decoration:none; }
  select, button { font:inherit; color:var(--text); background:#1f2532; border:1px solid var(--line); border-radius:8px; padding:7px 10px; cursor:pointer; }
  main { padding:18px 20px; max-width:1200px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin-bottom:18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .card h3 { margin:0 0 8px; font-size:13px; color:var(--mute); text-transform:uppercase; letter-spacing:.04em; }
  .big { font-size:26px; font-weight:800; }
  .row { display:flex; gap:14px; flex-wrap:wrap; color:var(--mute); font-size:13px; margin-top:6px; }
  .row b { color:var(--text); }
  .warn { color:#fbbf24; font-size:12px; margin-top:8px; } .err { color:var(--bad); font-size:12px; margin-top:8px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th, td { padding:9px 10px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
  th { color:var(--mute); font-weight:600; font-size:12px; text-transform:uppercase; cursor:pointer; }
  td.l, th.l { text-align:left; white-space:normal; }
  td img { width:44px; height:55px; object-fit:cover; border-radius:6px; background:#000; vertical-align:middle; }
  .cap { max-width:360px; color:#c9cfdb; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .net { font-size:12px; padding:2px 8px; border-radius:99px; background:#1f2532; }
  .hint { color:var(--mute); font-size:12px; }
  .tablewrap { overflow-x:auto; }
</style>
</head>
<body>
<header>
  <h1>İstatistikler</h1>
  <select id="brand"></select>
  <button id="refresh">Şimdi yenile</button>
  <span class="hint" id="updated"></span>
  <a href="/" style="margin-left:auto">← Panele dön</a>
</header>
<main>
  <div class="cards" id="cards"></div>
  <div class="tablewrap"><table>
    <thead><tr><th class="l"></th><th class="l">Gönderi</th><th class="l">Platform</th><th data-k="published_at">Tarih</th>
      <th data-k="views">İzlenme</th><th data-k="reach">Erişim</th><th data-k="likes">Beğeni</th><th data-k="comments">Yorum</th><th data-k="shares">Paylaşım</th><th data-k="saves">Kaydetme</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <p class="hint">Sayılar platformların kendi verileri; birkaç saatte bir otomatik güncellenir. "—" o platformun bu sayıyı vermediği ya da izin olmadığı anlamına gelir.</p>
</main>
<script>
const $ = (s) => document.querySelector(s);
const NETS = { instagram: 'Instagram', facebook: 'Facebook', threads: 'Threads', tiktok: 'TikTok', youtube: 'YouTube' };
let brand = localStorage.getItem('brand') || '', rows = [], sortKey = 'published_at', status = {};
const fmt = (n) => (n === undefined || n === null) ? '—' : Number(n).toLocaleString('tr-TR');
const esc = (s) => String(s || '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function load() {
  const brands = await (await fetch('/api/brands')).json();
  if (!brands.find((b) => b.slug === brand)) brand = brands[0]?.slug || '';
  $('#brand').innerHTML = brands.map((b) => `<option value="${b.slug}" ${b.slug === brand ? 'selected' : ''}>${esc(b.name)}</option>`).join('');
  rows = await (await fetch(`/api/stats?brand=${brand}`)).json();
  status = await (await fetch(`/api/stats/status?brand=${brand}`)).json();
  render();
}

function render() {
  const sum = {};
  for (const r of rows) {
    const s = sum[r.network] ||= { posts: 0 };
    s.posts++;
    for (const [k, v] of Object.entries(r.data)) if (typeof v === 'number') s[k] = (s[k] || 0) + v;
  }
  $('#cards').innerHTML = Object.keys(NETS).filter((n) => sum[n] || status[n]).map((n) => {
    const s = sum[n] || {}, st = status[n] || {};
    return `<div class="card"><h3>${NETS[n]}</h3>
      <div class="big">${fmt(s.views ?? s.reach)}</div><div class="hint">${s.views !== undefined ? 'toplam izlenme' : s.reach !== undefined ? 'toplam erişim' : 'izlenme verisi yok'}</div>
      <div class="row"><span><b>${fmt(s.likes)}</b> beğeni</span><span><b>${fmt(s.comments)}</b> yorum</span><span><b>${fmt(s.shares)}</b> paylaşım</span><span><b>${s.posts || 0}</b> gönderi</span></div>
      ${st.warning ? `<div class="warn">${esc(st.warning)}</div>` : ''}${st.ok === false ? `<div class="err">${esc(st.error)}</div>` : ''}</div>`;
  }).join('') || '<p class="hint">Henüz veri yok. "Şimdi yenile"ye bas.</p>';
  const val = (r) => sortKey === 'published_at' ? r.published_at : (r.data[sortKey] ?? -1);
  const sorted = [...rows].sort((a, b) => (val(b) > val(a) ? 1 : -1));
  $('#rows').innerHTML = sorted.map((r) => `<tr>
    <td class="l">${r.thumb ? `<img src="${esc(r.thumb)}" loading="lazy" referrerpolicy="no-referrer">` : ''}</td>
    <td class="l"><a href="${esc(r.url)}" target="_blank" style="color:inherit;text-decoration:none"><div class="cap">${esc(r.caption) || '<span class="hint">(açıklama yok)</span>'}</div></a></td>
    <td class="l"><span class="net">${NETS[r.network]}</span></td>
    <td>${r.published_at ? new Date(r.published_at).toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' }) : ''}</td>
    <td>${fmt(r.data.views)}</td><td>${fmt(r.data.reach)}</td><td>${fmt(r.data.likes)}</td><td>${fmt(r.data.comments)}</td><td>${fmt(r.data.shares)}</td><td>${fmt(r.data.saves)}</td></tr>`).join('');
  const last = rows.map((r) => r.updated_at).sort().pop();
  $('#updated').textContent = last ? `Son güncelleme: ${new Date(last.replace(' ', 'T') + 'Z').toLocaleString('tr-TR', { timeStyle: 'short', dateStyle: 'short' })}` : '';
}

$('#brand').onchange = (e) => { brand = e.target.value; localStorage.setItem('brand', brand); load(); };
$('#refresh').onclick = async () => {
  $('#refresh').disabled = true; $('#refresh').textContent = 'Yenileniyor…';
  try { status = await (await fetch(`/api/stats/refresh?brand=${brand}`, { method: 'POST' })).json(); } finally { $('#refresh').disabled = false; $('#refresh').textContent = 'Şimdi yenile'; }
  rows = await (await fetch(`/api/stats?brand=${brand}`)).json(); render();
};
document.querySelectorAll('th[data-k]').forEach((th) => th.onclick = () => { sortKey = th.dataset.k; render(); });
load();
</script>
</body>
</html>
