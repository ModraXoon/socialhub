<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Önizleme · SocialHub</title>
<style>
  :root { --bg:#0e1117; --text:#e8ebf1; --mute:#8b93a3; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display:flex; flex-direction:column; align-items:center; padding:24px 16px; }
  .note { color:var(--mute); margin-bottom:14px; text-align:center; }
  .phone { width:390px; max-width:100%; background:#fff; color:#111; border-radius:28px; overflow:hidden; box-shadow:0 20px 60px #0008; }
  .top { display:flex; align-items:center; gap:10px; padding:12px 14px; }
  .av { width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,#22d3ee,#a855f7); display:grid; place-items:center; color:#fff; font-weight:800; }
  .name { font-weight:700; font-size:14px; }
  .sub { font-size:12px; color:#666; }
  .media { position:relative; aspect-ratio:4/5; background:#000; overflow:hidden; }
  .track { display:flex; height:100%; transition:transform .3s; }
  .track > * { flex:0 0 100%; width:100%; height:100%; object-fit:cover; }
  .count { position:absolute; top:10px; right:10px; background:#000a; color:#fff; font-size:12px; padding:2px 8px; border-radius:99px; }
  .nav { position:absolute; top:50%; transform:translateY(-50%); width:30px; height:30px; border-radius:50%; border:0; background:#fffd; cursor:pointer; font-size:16px; }
  .prev { left:8px; } .next { right:8px; }
  .dots { display:flex; justify-content:center; gap:4px; padding:10px 0 2px; }
  .dot { width:6px; height:6px; border-radius:50%; background:#ccc; } .dot.on { background:#0095f6; }
  .icons { padding:6px 14px; font-size:22px; letter-spacing:10px; }
  .cap { padding:0 14px 16px; white-space:pre-wrap; font-size:14px; }
  .cap b { margin-right:6px; }
  .tag { color:#00376b; }
  .tabs { display:flex; gap:8px; margin-bottom:14px; }
  .tabs button { background:#1f2532; color:var(--text); border:1px solid #262c38; border-radius:8px; padding:6px 12px; cursor:pointer; font:inherit; }
  .tabs button.on { background:#22d3ee; color:#04131a; border:0; font-weight:700; }
</style>
</head>
<body>
<div class="note" id="note"></div>
<div class="tabs"><button data-v="ig" class="on">Instagram</button><button data-v="fb">Facebook</button></div>
<div class="phone">
  <div class="top"><div class="av" id="av"></div><div><div class="name" id="name"></div><div class="sub" id="sub"></div></div></div>
  <div class="media"><div class="track" id="track"></div><span class="count" id="count"></span>
    <button class="nav prev" id="prev">‹</button><button class="nav next" id="next">›</button></div>
  <div class="dots" id="dots"></div>
  <div class="icons">♡ 💬 ➤</div>
  <div class="cap" id="cap"></div>
</div>
<script>
const q = new URLSearchParams(location.search);
const id = Number(q.get('id')), brand = q.get('brand');
let i = 0, n = 0, view = 'ig', post, brandName = brand;
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const fileUrl = (f) => `/files/${brand}/${encodeURIComponent(f)}`;
function go(k) { i = Math.max(0, Math.min(n - 1, k)); document.getElementById('track').style.transform = `translateX(-${i * 100}%)`;
  document.getElementById('count').textContent = n > 1 ? `${i + 1}/${n}` : '';
  document.querySelectorAll('.dot').forEach((d, j) => d.classList.toggle('on', j === i)); }
function render() {
  const handle = view === 'ig' ? (brandName || '').toLowerCase().replace(/\s+/g, '') : brandName;
  document.getElementById('av').textContent = (brandName || '?')[0].toUpperCase();
  document.getElementById('name').textContent = handle;
  document.getElementById('sub').textContent = view === 'ig' ? 'Önizleme' : 'Şimdi · 🌍';
  const tagged = esc(post.caption).replace(/(#[\p{L}\p{N}_]+)/gu, '<span class="tag">$1</span>');
  document.getElementById('cap').innerHTML = view === 'ig' ? `<b>${esc(handle)}</b>${tagged}` : tagged;
}
fetch(`/api/brands`).then((r) => r.json()).then((bs) => { brandName = bs.find((b) => b.slug === brand)?.name || brand; return fetch(`/api/posts?brand=${brand}`); })
  .then((r) => r.json()).then((posts) => {
    post = posts.find((p) => p.id === id);
    if (!post) { document.getElementById('note').textContent = 'Gönderi bulunamadı.'; return; }
    n = post.media.length;
    document.getElementById('track').innerHTML = post.media.map((f) => /\.(mp4|mov)$/i.test(f)
      ? `<video src="${fileUrl(f)}" controls playsinline muted></video>` : `<img src="${fileUrl(f)}">`).join('');
    document.getElementById('dots').innerHTML = n > 1 ? post.media.map(() => '<span class="dot"></span>').join('') : '';
    const nets = ['instagram', 'facebook', 'threads', 'tiktok', 'youtube'].filter((k) => post.targets[k]).join(', ');
    document.getElementById('note').textContent = `Gönderi #${post.id} · durum: ${post.status} · platformlar: ${nets} · bu bir önizlemedir, hiçbir yerde yayınlanmadı`;
    render(); go(0);
  });
document.getElementById('prev').onclick = () => go(i - 1);
document.getElementById('next').onclick = () => go(i + 1);
document.querySelectorAll('.tabs button').forEach((b) => b.onclick = () => {
  view = b.dataset.v; document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b)); if (post) render(); });
</script>
</body>
</html>
